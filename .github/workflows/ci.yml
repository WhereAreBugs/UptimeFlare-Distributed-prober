name: probe
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./cmd/... ./internal/...
      - run: go test -tags nootel ./cmd/... ./internal/...
      - run: go vet ./cmd/... ./internal/...
      - run: node --test scripts/local-history.test.cjs
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sh scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          retention-days: 1
          path: bin/
